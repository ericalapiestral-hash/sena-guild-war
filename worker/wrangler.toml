name = "sena-guild-search"
main = "worker.js"
compatibility_date = "2024-11-01"

# 이 워커는 외부 API 키를 쓰지 않는다 — AI 작업은 전부 Workers AI(아래 [ai] 바인딩)로 돈다.
# 시크릿(secret)도, vars도 필요 없다. 추가하기 전에 정말 필요한지 다시 생각할 것.

# 공유 데이터(카운터덱·영웅·가이드·통계) 저장용 KV. 아래 명령으로 만들고 출력된 id를 넣으세요:
#   npx wrangler kv namespace create GUILD_KV
[[kv_namespaces]]
binding = "GUILD_KV"
id = "a31934f6fd8d46d7bc45039f1d1b8d93"

# 캡처 점수 읽기(/ocr)·학습(/learn)용 Workers AI. 무료 할당량(하루 10,000뉴런) 안에서 동작.
[ai]
binding = "AI"

# 자동 학습 루틴 — 매일 06:00 KST 에 라운지 새 공략을 학습한다.
# ★ Cloudflare cron 은 UTC 기준이라 21:00 UTC = 다음날 06:00 KST.
# 밤사이 올라온 글까지 모아 아침에 브리핑이 준비돼 있게 하는 시각이다.
#
# 더 자주 돌리기 전에 Workers AI 무료 할당량(하루 10,000뉴런)을 먼저 확인할 것 —
# 1회 실행에 글 최대 6개 × 비전 1회 + 종합 1~2회가 든다.
[triggers]
crons = ["0 21 * * *"]
